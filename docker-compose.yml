services:
  postgresql:
    image: postgres:16
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-db:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.25
    depends_on:
      - postgresql
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8080:8080"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: ["node", "dist/server.js"]
    depends_on:
      - temporal
      - redis
    environment:
      PORT: "3000"
      TEMPORAL_ADDRESS: temporal:7233
      REDIS_URL: redis://redis:6379
      SUPPLIER_BASE_URL: http://api:3000
    ports:
      - "3000:3000"
    restart: on-failure

  worker:
    build: .
    command: ["node", "dist/worker.js"]
    depends_on:
      - temporal
      - redis
      - api
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      REDIS_URL: redis://redis:6379
      SUPPLIER_BASE_URL: http://api:3000
    restart: on-failure

volumes:
  temporal-db:
